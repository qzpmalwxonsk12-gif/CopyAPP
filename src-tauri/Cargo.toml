[package]
name = "copyapp"
version = "0.1.3"
description = "A private, local-first Windows clipboard manager"
authors = ["CopyAPP"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "copyapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CopyAPP"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
printpdf = { version = "=0.12.7", default-features = false, features = ["text_layout"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["std", "monitor"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
